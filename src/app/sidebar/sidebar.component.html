<nav id="sidebar" [ngClass]="{ 'active': isMenuOpen }">

  <!-- ================================
       SIDEBAR HEADER
  ================================= -->
  <div class="sidebar-header">
    <h1 class="mb-0">
      <a class="logo" style="font-style: italic;">
        EAL
      </a>
    </h1>

    <div class="custom-menu">
      <button type="button" id="sidebarCollapse" class="btn btn-primary" (click)="toggleMenu()">
        <i class="fa fa-bars"></i>
        <span class="sr-only">Toggle Menu</span>
      </button>
    </div>
  </div>

  <!-- ================================
       NAVIGATION
  ================================= -->
  <ul class="list-unstyled components sidebar-menu">

    <!-- HOME (sabke liye – sirf Check Demand Raise wale officers ko nahi) -->
    @if (showHome) {
    <li class="active">
      <a (click)="onNavigation('home')" style="cursor: pointer;">
        <span class="fa fa-home"></span>
        <span class="menu-text">Home</span>
      </a>
    </li>
    }

    <!-- DYNAMIC MENUS (API se aane wale) -->
    @for (menu of menuList; track menu.PageUrl) {
      <li>
        <a (click)="onNavigation(menu.PageUrl)" style="cursor: pointer;">
          <span class="fa {{ menu.IconClass }}"></span>
          <span class="menu-text">{{ menu.PageName }}</span>
        </a>
      </li>
    }

    <!-- LOGOUT (Sabke liye fixed) -->
    <li class="logout-menu">
      <a (click)="onLogOutClick()" style="cursor: pointer;">
        <span class="fa fa-sign-out"></span>
        <span class="menu-text">Logout</span>
      </a>
    </li>

  </ul>

  <!-- ================================
       FOOTER
  ================================= -->
  <div class="footer">
    <p>
      Copyright
      <i class="fa fa-copyright" aria-hidden="true"></i>
      2026-2027. All Rights Reserved by
      <a target="_blank">NIC</a>
      Excise Department
    </p>
  </div>

</nav>
