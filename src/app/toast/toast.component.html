<div class="toast-container position-fixed top-0 end-0 p-3">
  @for (toast of toastService.toasts; track toast) {
    <div
      class="toast show align-items-center text-white bg-{{ toast.class || 'info' }} border-0"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      >
      <div class="d-flex">
        <div class="toast-body">
          {{ toast.message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.remove(toast)" aria-label="Close"></button>
      </div>
    </div>
  }
</div>
